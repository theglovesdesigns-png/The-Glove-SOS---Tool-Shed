[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# v3.4: where the back office lives. Netlify builds every file in
# this folder into a serverless function automatically.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
